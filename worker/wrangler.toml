# Hosted MCP endpoint. Deployed by Cloudflare Workers Builds from this repo's
# main branch (root directory `worker`, deploy command `npx wrangler deploy`).
# The name must match the Worker in the Cloudflare dashboard, or the build fails.
name = "agent-infrastructure-landscape"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
DATA_BASE = "https://raw.githubusercontent.com/MrPeppersDev/agent-infrastructure-landscape/main/"

[limits]
cpu_ms = 30000
