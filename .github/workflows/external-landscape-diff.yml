# Phase 5 — standing external-landscape poller (issue #151).
#
# Runs on the 1st of each month. For each enabled source in
# data/_external-landscapes.yml, refreshes the vendored snapshot to a
# new dated directory under extraction/external/<id>/<YYYYMMDD>/,
# re-runs scripts/import_external_landscapes.py, diffs the resulting
# candidates.csv / cross-listing.csv against the pre-run state, and
# opens (a) one intake-batch issue if new candidates appeared and
# (b) one divergence issue per source that changed categorisation.
#
# Cadence choice: monthly. Upstream landscape churn is low (last commit
# on agentic-community was 2026-02-23; antgroup last touched 2026-05-29).
# A monthly poll is signal, not noise; if the maintainer wants tighter
# responsiveness, drop this to weekly by tightening the cron expression.
#
# Antgroup rule: manifest carries `enabled: false` — the poller skips it
# entirely per the Phase 0 licence audit (docs/DECISIONS.md 2026-07-09).
#
# No-op runs are silent — no issue, no commit.

name: External landscapes diff

on:
  schedule:
    # Midnight UTC on the 1st of each month.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: external-landscape-diff
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install poller deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Ensure external-landscape labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create external-landscapes \
            --description "Ingestion workstream for external agent-landscape sources" \
            --color 5319E7 --force || true
          gh label create intake-batch \
            --description "Batch signal of new upstream landscape rows" \
            --color 1D76DB --force || true
          gh label create divergence \
            --description "Category drift between our catalog and upstream" \
            --color BFD4F2 --force || true

      - name: Run external-landscape poller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/poll_external_landscapes.py

      - name: Commit refreshed snapshots and artefacts
        run: |
          set -euo pipefail
          if git diff --quiet extraction/external/ 2>/dev/null; then
            echo "no snapshot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extraction/external/
          git commit -m "chore(external-landscapes): refresh snapshots + diff (Phase 5)"
          git push || true
