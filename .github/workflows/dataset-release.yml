# Monthly dataset release (product review, 2026-10-30: "versioned dataset
# releases"). On the 1st of each month (or by hand) this tags main as
# dataset-YYYY-MM and publishes a GitHub release with the catalog files
# attached and notes built from the month's recorded changes, so a paper,
# a vendor or another tool can cite one fixed version of the data.
#
# The tag prefix is deliberately not `data-v*`: that prefix triggers the
# npm / MCP Registry publish (publish-mcp.yml), which tracks package
# versions, not months. Tags pushed with GITHUB_TOKEN don't trigger other
# workflows either way.
name: Dataset release

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="dataset-$(date -u +%Y-%m)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice title=Dataset release::$TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/build_history.py
          python3 scripts/dataset_release_notes.py --tag "$TAG" > release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Tag and publish
        if: steps.notes.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.notes.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Dataset $(date -u +%Y-%m)" \
            --notes-file release-notes.md \
            data/landscape.json data/landscape.edges.json data/stack-index.json data/history.json
