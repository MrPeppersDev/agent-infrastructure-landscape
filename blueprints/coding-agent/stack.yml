version: 1
product: coding-agent
requirements:
  language: any
  hosting: any
  oss: false
  mcp: false
components:
  framework: langchain-framework--langchain-com  # LangChain (framework)
  model: anthropic-claude-foundation-models--anthropic-com  # Anthropic Claude (foundation models)
  gateway: litellm--gh-berriai-litellm  # LiteLLM
  memory: claude-mem--gh-thedotmack-claude-mem  # claude-mem
  sandbox: e2b--e2b-dev  # e2b
  tools: composio--composio-dev  # Composio
  observability: arize-phoenix--phoenix-arize-com  # Arize Phoenix
  guardrails: google-cloud-model-armor--cloud-google-com  # Google Cloud Model Armor
