# Agent stack — generated by the AI Agent Infrastructure Landscape (plan_stack).
# Check it any time: npx landscape check stack.yml, or the "AI stack check" GitHub Action.
version: 1
product: research-agent
requirements:
  language: any
  hosting: self
  oss: true
  mcp: false
components:
  framework: langchain-framework--langchain-com  # LangChain (framework)
  model: mistral-large-2-mixtral-family--mistral-ai  # Mistral Large 2 / Mixtral family
  gateway: litellm--gh-berriai-litellm  # LiteLLM
  browser: stagehand--stagehand-dev  # Stagehand
  sandbox: e2b--e2b-dev  # e2b
  vectors: milvus--milvus-io  # Milvus
  embeddings: sentence-transformers--sbert-net  # Sentence Transformers
  memory: mem0--mem0-ai  # Mem0
  observability: langfuse--langfuse-com  # Langfuse
  guardrails: promptfoo--promptfoo-dev  # Promptfoo
  serving: vllm--gh-vllm-project-vllm  # vLLM
