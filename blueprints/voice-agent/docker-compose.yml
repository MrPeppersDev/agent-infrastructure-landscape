# Starter for the self-hosted voice agent blueprint (blueprints/voice-agent/stack.self-hosted.yml).
# Generated by `make blueprints` from data/blueprints/images.json: official images and ports from each project's docs.
# A local starting point, not a production deployment: add auth, persistence and resource limits before real use.
services:
  serving:
    # vLLM — https://docs.vllm.ai/en/latest/deployment/docker.html
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: "<huggingface token>"

# Not started here:
#   Voice runtime: LiveKit Agents — library or hosted-only; no container
#   Foundation model: Mistral Large 2 / Mixtral family — library or hosted-only; no container
#   Agent framework: LangChain (framework) — library or hosted-only; no container
#   Memory layer: Mem0 — No published server image: docker-compose builds from server/dev.Dockerfile (API 8888->8000, dashboard 3000). README: 'at minimum set POSTGRES_PASSWORD and OPENAI_API_KEY'.
#   Tools, auth and MCP: Composio — library or hosted-only; no container
#   Evals & observability: Langfuse — needs docker.langfuse.com/langfuse/langfuse-worker:4, postgres:17, clickhouse/clickhouse-server, redis:7, minio (S3); use the project's compose file: https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
#   Guardrails & security: NVIDIA NeMo Guardrails — library or hosted-only; no container
