# benchmark-families.yml
# Phase 2 follow-up — Benchmark → task-family classification for the
# capability composite (docs/composite-methodology.md §3.2).
#
# Generated: 2026-07-01
# Ratification status: RATIFIED 2026-07-01 — maintainer approved the
# full draft.
# Entries in the "ADDED 2026-11-03" section at the end are PENDING
# ratification; see that section's header. The two deferred entries were resolved 2026-07-10 via
# #133: `alphacode` → excluded, `swe-lancer` → agentic.
#
# ==============================================================================
# WHY THIS FILE EXISTS
# ==============================================================================
# The composite methodology (§3.2) says every benchmark used in a row's
# `capability-benchmark-sources` cell MUST be classified into exactly one
# of three task families: code, agentic, longcontext. Unclassified
# benchmarks are IGNORED (not defaulted to a family) — a benchmark with
# no clear family belongs in no family.
#
# This is the single flat lookup table that governs that classification.
# `mcp/src/composite.ts` reads it (via the caller's family-assignment
# step) before computing family sub-scores.
#
# ==============================================================================
# SCOPE: CLASSIFIED VS EXCLUDED
# ==============================================================================
# CLASSIFIED — the benchmark clearly measures one of the three families
#   and its score belongs in that family's sub-score.
#
# EXCLUDED — the benchmark exists and is respected, but does not cleanly
#   fit any of the three families (e.g. MMLU, GPQA measure general
#   knowledge/reasoning, not one of code/agentic/longcontext). Rows may
#   still record these scores in `capability-benchmark-sources` for
#   documentation, but they contribute zero to the composite.
#
# The EXCLUDED list is authored explicitly rather than left implicit
# so a future maintainer knows we thought about MMLU and chose to
# exclude it — not that we forgot.
#
# ==============================================================================
# TRUST FILTERING IS SEPARATE
# ==============================================================================
# Even a CLASSIFIED benchmark is only included in the composite if its
# `trustScore` from `web/src/lib/analyses/benchmark-trust.ts` is ≥ 40
# (the existing `medium` tier cutoff). That filter runs in the compose
# pipeline, not here. This file only asks: "which family, if any?"
#
# ==============================================================================
# ENUM
# ==============================================================================
#   code         — coding assistance, refactoring, multi-file edits,
#                  IDE workflows.
#   agentic      — tool use, planning, multi-step task completion in
#                  agent harnesses.
#   longcontext  — recall and reasoning over 100k+ token inputs.
#   excluded     — respected benchmark that does not fit the three
#                  families; contributes zero to the composite.
#
# ==============================================================================
# CONFIDENCE MARKERS
# ==============================================================================
#   ✓  high   — canonical for its family; named in methodology §2 or
#               universally accepted as such.
#   ~  medium — the family assignment is defensible but the benchmark
#               has some scope ambiguity (umbrella suites, variants).
#   ?  low    — boundary case, flagged for maintainer scrutiny.
#
# Maintainer review: please spot-check the ~ and ? entries in
# particular. High-confidence entries can be scanned.

# ==============================================================================
# CODE
# ==============================================================================

swe-bench-verified:
  family: code
  confidence: high
  rationale: |
    Verified subset of SWE-Bench — real-world software engineering
    tasks resolved against actual GitHub issues. Named in methodology §2
    as an anchor benchmark for the code family.

aider-polyglot:
  family: code
  confidence: high
  rationale: |
    Multi-language code editing benchmark used by Aider; measures
    diff-application accuracy across Python, Rust, C++, Go, Java, JS.
    Named in methodology §2.

livecodebench:
  family: code
  confidence: high
  rationale: |
    Contamination-resistant coding benchmark that continuously adds
    fresh problems (Codeforces, AtCoder, LeetCode).
    Named in methodology §2. Reports separately on "code generation"
    vs "code execution" vs "test output prediction" — we classify at
    the umbrella level (§3.2: single family per benchmark ID) and do
    not split sub-tasks.

humaneval:
  family: code
  confidence: high
  rationale: |
    Classic Python function-completion benchmark (Chen et al. 2021).
    Widely reported to be saturated / contaminated on frontier models;
    likely to be dropped by the trust filter (`trustScore < 40`) for
    most rows. Classification stands; the trust filter is where the
    "should we still trust this?" call is made.

mbpp:
  family: code
  confidence: high
  rationale: |
    Mostly Basic Python Problems (Austin et al. 2021). Same story as
    HumanEval — likely trust-filtered out on frontier models but the
    family is unambiguously code.

codecontests:
  family: code
  confidence: high
  rationale: |
    Competitive-programming benchmark from DeepMind (AlphaCode paper).

apps:
  family: code
  confidence: high
  rationale: |
    Automated Programming Progress Standard — Hendrycks et al. 2021.
    Introductory to competition-level Python problems.

bigcodebench:
  family: code
  confidence: high
  rationale: |
    Practical, library-heavy Python tasks; harder than HumanEval.

# ==============================================================================
# AGENTIC
# ==============================================================================

gaia:
  family: agentic
  confidence: high
  rationale: |
    General AI Assistants benchmark (Mialon et al. 2023). Multi-step
    real-world tasks requiring tool use, web browsing, file handling.
    Named in methodology §2.

agentbench:
  family: agentic
  confidence: medium
  rationale: |
    Umbrella suite covering OS, DB, KG, code-agent, web-shopping, web-
    browsing, digital-card-game, house-holding sub-tasks. The OS
    sub-task is CLI/shell (arguably code-adjacent) but the umbrella
    intent is agent-behavior evaluation. We classify at the umbrella
    level and do NOT split sub-benchmarks.

tau-bench:
  family: agentic
  confidence: high
  rationale: |
    τ-bench (Sierra Research) — structured tool-use benchmark with
    user-simulator + database. Named in methodology §2.

osworld:
  family: agentic
  confidence: high
  rationale: |
    Real-computer-desktop task benchmark (screen interaction, application
    workflows). Named in methodology §2.

webarena:
  family: agentic
  confidence: high
  rationale: |
    Web navigation / task completion in a reproducible sandboxed web
    environment (Zhou et al. 2023).

visualwebarena:
  family: agentic
  confidence: high
  rationale: |
    Visual extension of WebArena; same task shape, adds screenshot
    reasoning.

swe-agent-bench:
  family: agentic
  confidence: low
  rationale: |
    BOUNDARY CASE. SWE-Agent is a scaffold, not a benchmark per se —
    scores reported "on SWE-Agent" usually mean SWE-Bench Verified
    solved through the SWE-Agent harness. If a row reports a distinct
    `swe-agent-bench` number that isn't equivalent to a SWE-Bench
    score, treat it as agentic (measures the harness's planning/tool
    behavior). Maintainer: please confirm or remove.

mle-bench:
  family: agentic
  confidence: medium
  rationale: |
    OpenAI's ML Engineering benchmark — Kaggle-style tasks completed
    by an agent. Sits between code and agentic; we classify agentic
    because the score depends heavily on planning + tool orchestration,
    not just code generation.

# ==============================================================================
# LONGCONTEXT
# ==============================================================================

ruler:
  family: longcontext
  confidence: high
  rationale: |
    Realistic Understanding of Long-context Evaluation (Hsieh et al.
    2024). Named in methodology §2. Multiple context-length variants
    (RULER-4k, 8k, 32k, 128k) — treat as ONE benchmark ID; the specific
    length is recorded in the run metadata, not the ID.

ruler-128k:
  family: longcontext
  confidence: high
  rationale: |
    Alias used in test-composite.ts fixtures. Same benchmark as `ruler`
    at 128k context. Kept as a separate ID here because it appears
    explicitly in test data; production pipeline should canonicalise
    to `ruler` and record `context_length: 128000` in run metadata.

longbench:
  family: longcontext
  confidence: high
  rationale: |
    Bilingual long-context benchmark suite (Bai et al. 2023). Named in
    methodology §2.

longbench-v2:
  family: longcontext
  confidence: high
  rationale: |
    Second-generation LongBench with harder tasks and longer contexts.

infinitebench:
  family: longcontext
  confidence: high
  rationale: |
    100k+ token context evaluation (Zhang et al. 2024).

needle-in-a-haystack:
  family: longcontext
  confidence: medium
  rationale: |
    Umbrella term covering many variants (Kamradt's original;
    multi-needle; needles-in-a-needlestack; passkey retrieval). The
    variants differ but all measure the same underlying construct
    (long-context recall). We classify at the umbrella level and treat
    variants as the same benchmark ID.

zeroscrolls:
  family: longcontext
  confidence: high
  rationale: |
    Zero-shot long-document benchmark (SCROLLS successor). Long-form
    summarization, question answering over full-length inputs.

booksum:
  family: longcontext
  confidence: medium
  rationale: |
    Book-length summarization. Long-context by construction, though
    scored partly on summary quality (which crosses into general
    language capability). Classifying longcontext because the
    "distinguishing" axis it measures is context length, not summary
    fluency.

loong:
  family: longcontext
  confidence: medium
  rationale: |
    Longer-context reasoning benchmark (Wang et al. 2024). Recent and
    less well-established than RULER; classification is unambiguous
    but the trust filter may exclude it early.

# ==============================================================================
# EXCLUDED — respected, but not one of the three families
# ==============================================================================
# These benchmarks may appear in `capability-benchmark-sources` cells
# for documentation. They contribute ZERO to the composite. Recording
# a score for them does not reduce a row's composite; it is simply not
# used in aggregation.

mmlu:
  family: excluded
  confidence: high
  rationale: |
    Massive Multitask Language Understanding (Hendrycks et al. 2020).
    Measures general knowledge across 57 subjects. Does not fit any of
    the three families. Excluding rather than forcing into a fourth
    family (see methodology §2 "why three, not more").

mmlu-pro:
  family: excluded
  confidence: high
  rationale: |
    Harder MMLU variant. Same reasoning as MMLU.

gpqa:
  family: excluded
  confidence: high
  rationale: |
    Graduate-level Physics/Chemistry/Biology Q&A (Rein et al. 2023).
    General reasoning, not one of our three families.

gpqa-diamond:
  family: excluded
  confidence: high
  rationale: |
    Hardest GPQA subset. Same reasoning as GPQA.

hellaswag:
  family: excluded
  confidence: high
  rationale: |
    Commonsense reasoning. General capability, not a family axis.

arc-agi:
  family: excluded
  confidence: medium
  rationale: |
    ARC-AGI (Chollet) — abstract visual pattern reasoning. Not code,
    not agentic, not long-context. Notable and respected, but excluded.

arc:
  family: excluded
  confidence: high
  rationale: |
    AI2 Reasoning Challenge (grade-school science). Not one of the
    three families.

bigbench:
  family: excluded
  confidence: high
  rationale: |
    Umbrella of 200+ heterogeneous tasks. Impossible to assign a single
    family; excluded on scope grounds.

mt-bench:
  family: excluded
  confidence: high
  rationale: |
    Multi-turn chat evaluation (Zheng et al. 2023). General chat
    quality; not one of our three families.

chatbot-arena:
  family: excluded
  confidence: high
  rationale: |
    Human-preference Elo. Used in methodology §8.2 as a CROSS-CHECK
    against the composite; explicitly not an input to it (would
    circularly validate).

helm:
  family: excluded
  confidence: high
  rationale: |
    Meta-benchmark aggregating many tasks. Individual HELM sub-tasks
    may be classifiable separately if a row reports one; the HELM
    aggregate itself is excluded.

truthfulqa:
  family: excluded
  confidence: high
  rationale: |
    Truthfulness / factuality benchmark. Distinct axis from our three;
    excluded.

# ==============================================================================
# BENCHMARKS FLAGGED FOR MAINTAINER JUDGMENT
# ==============================================================================
# These were boundary cases held at `family: null` (treated as excluded)
# pending an explicit maintainer call. Both were resolved via #133 on
# 2026-07-10; the entries stay here to document the deferral + decision.

alphacode:
  family: excluded
  confidence: high
  rationale: |
    RESOLVED 2026-07-10 (#133): excluded. AlphaCode is a model+scaffold,
    not a test dataset — scores attributed to "AlphaCode" measure
    performance on CodeContests problems run through the AlphaCode
    harness. The underlying benchmark is `codecontests` (already
    classified code/high); recording results under `alphacode` would
    double-count. Same philosophy as the `chatbot-arena` exclusion
    (harness/leaderboard, not upstream data source). Zero rows cited
    this ID at resolution time; direct any future rows to
    `codecontests` instead.

swe-lancer:
  family: agentic
  confidence: medium
  rationale: |
    RESOLVED 2026-07-10 (#133): agentic. OpenAI (2025,
    arXiv:2502.12115) — 1,400+ real Upwork freelance tasks graded by
    end-to-end test suites and economic payout, including SWE-Manager
    decision sub-tasks. IC sub-tasks resemble SWE-Bench Verified, but
    the defining axis is multi-step task completion under real-world
    constraints — same logic as `mle-bench` (agentic). Medium
    confidence: the IC component has code-generation character; if
    rows ever report IC and Manager scores separately, reconsider a
    split at that time.

# ==============================================================================
# ADDED 2026-11-03 — benchmarks the 2026 flagship announcements report
# ==============================================================================
# Status: PENDING MAINTAINER RATIFICATION. Every 2026 flagship post (Opus 5.5,
# GPT-6 Astra, Gemini 4, Grok 4.7, Mistral Large 4, DeepSeek V4, Qwen3.8,
# Command A+) reports benchmarks the file above does not know, so the
# model rows' composites were resting on 2025 models. Facts below come from
# each benchmark's official source, collected in
# extraction/benchmark-sources-2026-11-03/benchmark-descriptions.md; the
# `source` line names the page read. The ~ and ? entries want a second
# opinion. Umbrella rule (§3.2) still applies: versions of one benchmark
# (Terminal-Bench 2.1 vs 4.0) share an id and the cell text names the
# version; a new task set gets a new id (osworld-2).

# --- code ---------------------------------------------------------------------

swe-bench-pro:
  family: code
  confidence: high
  added: 2026-11-03
  source: https://arxiv.org/abs/2509.16941
  rationale: |
    Scale AI (2025-09). Given a codebase and an issue, produce a patch;
    1,865 problems over 41 repos, public / held-out / commercial splits.
    Metric is pass@1 resolve rate. Same task shape as swe-bench-verified
    with harder, contamination-resistant instances.

deepswe:
  family: code
  confidence: high
  added: 2026-11-03
  source: https://deepswe.datacurve.ai/blog/deepswe
  rationale: |
    Datacurve (2026-05, v1.1 2026-06). 113 long-horizon engineering tasks
    written from scratch across 91 repos in five languages, each with an
    executable verifier; pass@1 pass rate. v1.1 changed execution and
    grading, not the tasks, so versions share this id.

swe-sweep:
  family: code
  confidence: high
  added: 2026-11-03
  source: https://swesweep.com/
  rationale: |
    Meta Superintelligence Labs et al. (2026). Discover and repair as
    many bugs as possible in 100 real repositories (4.1k bugs) with no
    issue text or hints; metric is the micro-average of bugs resolved
    with the original suite still passing.

nl2repo-bench:
  family: code
  confidence: high
  added: 2026-11-03
  source: https://arxiv.org/abs/2512.12730
  rationale: |
    Ding et al. (2025-12). Build a complete installable Python library
    from a requirements document, graded by the upstream repo's own
    pytest suite; average test pass rate. Vendors print "NL2Repo".

frontiercode:
  family: code
  confidence: medium
  added: 2026-11-03
  source: https://cognition.com/blog/frontier-code
  rationale: |
    Cognition (2026-06). 150 maintainer-authored tasks (Diamond 50, Main
    100, Extended 150) judged on mergeability. Two metrics coexist: a
    pass rate and a weighted rubric score; Artificial Analysis's
    "FrontierCode 1.1 / 2.0" are its own implementations reporting the
    rubric score. Medium because cells must say which metric and whose
    run; the task set is private.

swe-atlas-qna:
  family: code
  confidence: low
  added: 2026-11-03
  source: https://huggingface.co/datasets/ScaleAI/SWE-Atlas-QnA
  rationale: |
    Scale AI (2026-05). 124 questions about pinned repositories graded
    by an LLM judge against an expert rubric; task resolve rate. It is
    code comprehension rather than editing (modifying files fails the
    task), so "coding assistance" fits only loosely. Maintainer: confirm
    code or move to excluded.

frontierswe:
  family: code
  confidence: low
  added: 2026-11-03
  source: https://www.frontierswe.com/
  rationale: |
    Proximal Labs (2026). 34 performance-engineering, computational-
    science and ML-research tasks, 5 trials each with a 20-hour budget;
    reward is a category-gated 0-1 value reported as mean@5, not a
    percent-resolved rate. Low confidence: bounded and comparable
    across rows, but a different kind of number. Maintainer: confirm
    or exclude.

# --- agentic ------------------------------------------------------------------

terminal-bench:
  family: agentic
  confidence: medium
  added: 2026-11-03
  source: https://www.tbench.ai/
  rationale: |
    Stanford / Laude Institute (2025-05; 2.0 2025-11, 2.1 2026-05, 4.0
    2026-08). English instruction, Docker environment, test script;
    tasks span software engineering, sysadmin, data and ML work.
    Metric is resolution rate. Agentic rather than code because the
    tasks are end-to-end terminal work with planning and tool use, and
    many are not code edits. Versions are not score-comparable; cells
    name the version. "Terminal-Bench Hard" is an Artificial Analysis
    subset and folds into this id with the subset named.

osworld-2:
  family: agentic
  confidence: high
  added: 2026-11-03
  source: https://osworld-v2.xlang.ai/
  rationale: |
    XLANG Lab, HKU (2026-06). A new task set, not a version of
    `osworld`: 108 long-horizon computer-use workflows (median 1.6
    human-hours, about 318 tool calls) with a binary completion metric
    at 500 steps and a secondary partial reward. "OSWorld 2.1" is the
    2026-09 bug-fix code release of the same tasks. OSWorld and
    OSWorld-Verified stay under `osworld`.

automationbench:
  family: agentic
  confidence: high
  added: 2026-11-03
  source: https://arxiv.org/abs/2604.18934
  rationale: |
    Zapier (2026-04). Business-process tasks in simulated SaaS
    environments (CRM, calendar, inbox) where the agent discovers REST
    tools and must reach an expected final state; strict full-task pass
    rate on a private held-out set. AutomationBench-AA (Artificial
    Analysis, 657 private tasks, share of objectives completed) is a
    different metric and folds into this id with the variant named.

browsecomp:
  family: agentic
  confidence: medium
  added: 2026-11-03
  source: https://arxiv.org/abs/2504.12516
  rationale: |
    OpenAI (2025-04). 1,266 questions that need persistent web browsing
    to find entangled, hard-to-locate facts; accuracy with a model
    grader. Agentic because the capability measured is multi-step tool
    use; medium because the output is a short answer, not a task state.

agents-last-exam:
  family: agentic
  confidence: medium
  added: 2026-11-03
  source: https://arxiv.org/abs/2606.05405
  rationale: |
    Berkeley RDI (2026-06). Long-horizon, economically valuable tasks
    with verifiable outcomes mapped to occupations; average full pass
    rate. Medium because the task pool is growing (1,500+ toward
    5,000), so scores shift with the release used.

cybench:
  family: agentic
  confidence: low
  added: 2026-11-03
  source: https://cybench.github.io/
  rationale: |
    Stanford (2024-08). 40 professional capture-the-flag tasks with
    subtasks; "% solved" unguided or subtask-guided. Multi-step tool
    use in a harness fits agentic, but the domain is offensive
    security only. Maintainer: confirm or exclude.

# --- longcontext --------------------------------------------------------------

mrcr:
  family: longcontext
  confidence: medium
  added: 2026-11-03
  source: https://huggingface.co/datasets/openai/mrcr
  rationale: |
    OpenAI dataset (2025-04), after Gemini's MRCR eval (2024-09). Find
    the i-th of several identical asks hidden in a synthetic
    conversation; context bins from 4k to 1M tokens. Metric is a 0-1
    string-similarity ratio (partial credit), reported as a percentage;
    cells name the context bin. No official "v2" exists.

graphwalks:
  family: longcontext
  confidence: medium
  added: 2026-11-03
  source: https://huggingface.co/datasets/openai/graphwalks
  rationale: |
    OpenAI dataset (2025-04). BFS or parent lookup over an edge list up
    to about 1.75M characters; metric is F1 over the returned node set.
    Long-context by construction; medium because F1 is not a pass rate.

